baseURL: "https://james-bao.github.io/"
languageCode: en-us
title: "James Bao"
theme: PaperMod

paginate: 10

params:
  env: production
  description: "Personal blog — thoughts on engineering, AI, and more."
  author: "James Bao"
  math: true
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowShareButtons: false
  ShowWordCount: true

  homeInfoParams:
    Title: "Hi, I'm James Bao"
    Content: "Welcome to my blog — I write about engineering, AI, and things I find interesting."

  socialIcons:
    - name: github
      url: "https://github.com/James-Bao"

  cover:
    linkFullImages: true
    responsiveImages: true

  assets:
    favicon: "/favicon.ico"
    disableFingerprinting: false

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 1
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 2
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 3
    - identifier: search
      name: Search
      url: /search/
      weight: 4

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - $$
              - $$
          inline:
            - - $
              - $
        enable: true
    renderer:
      unsafe: true
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
